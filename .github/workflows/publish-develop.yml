name: Publish Develop Docker Plugin

on:
  push:
    branches:
      - develop

permissions: {}

concurrency:
  group: develop-plugin-publication
  queue: max

env:
  IMAGE_REPOSITORY: ghcr.io/mkapusnik-apps/glusterfs-volume
  SOURCE_URL: ${{ github.server_url }}/${{ github.repository }}

jobs:
  publication:
    name: Develop plugin publication
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    outputs:
      promote: ${{ steps.current-after.outputs.result }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push exact-SHA multi-arch image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.IMAGE_REPOSITORY }}:source-${{ github.sha }}
          labels: |
            org.opencontainers.image.title=glusterfs-volume
            org.opencontainers.image.source=${{ env.SOURCE_URL }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=latest
            org.opencontainers.image.ref.name=source-${{ github.sha }}
          build-args: |
            VERSION=latest
            VCS_REF=${{ github.sha }}

      - name: Verify current develop head before mutable publication
        id: current-before
        uses: actions/github-script@v9
        env:
          CHECK_PURPOSE: mutable publication
        with:
          github-token: ${{ github.token }}
          result-encoding: string
          script: |
            const check = require('./.github/scripts/is-current-develop.js');
            return await check({ github, context, core });

      - name: Publish latest plugin packages
        if: steps.current-before.outputs.result == 'true'
        uses: ./.github/actions/publish-plugin
        with:
          image-repository: ${{ env.IMAGE_REPOSITORY }}
          image-digest: ${{ steps.build.outputs.digest }}
          plugin-base: ${{ env.IMAGE_REPOSITORY }}:latest

      - name: Verify current develop head after mutable publication
        id: current-after
        if: steps.current-before.outputs.result == 'true'
        uses: actions/github-script@v9
        env:
          CHECK_PURPOSE: promotion
        with:
          github-token: ${{ github.token }}
          result-encoding: string
          script: |
            const check = require('./.github/scripts/is-current-develop.js');
            return await check({ github, context, core });

  promotion:
    name: Promote published develop
    needs: publication
    if: needs.publication.outputs.promote == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout published revision
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Create or update promotion pull request
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.PAT_ACTIONS }}
          retries: 2
          script: |
            const promote = require('./.github/scripts/promote-develop.js');
            return await promote({ github, context, core });
