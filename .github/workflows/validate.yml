name: PR Validation

on:
  pull_request:
    branches:
      - develop

permissions:
  contents: read

concurrency:
  group: pr-validation-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    name: Go validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: 1.20.x
          cache: true

      - name: Check formatting
        run: |
          go fmt ./...
          git diff --exit-code

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Build for amd64
        run: go build -trimpath ./...

      - name: Build for arm64
        env:
          CGO_ENABLED: "0"
          GOARCH: arm64
          GOOS: linux
        run: go build -trimpath ./...
