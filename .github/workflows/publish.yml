name: Publish Docker Plugin

on:
  push:
    branches:
      - master

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Compute plugin name
        id: meta
        run: |
          REPO=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          if [ "${{ github.ref_name }}" = "master" ]; then
            TAG=latest
          else
            TAG=$(echo "${{ github.ref_name }}" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9._-]+/-/g' | sed -E 's/^-+|-+$//g')
          fi
          {
            echo "tag=${TAG}"
            echo "repository=${REPO}"
            echo "plugin=${REPO}:${TAG}"
          } >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Build and push multi-arch image
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/${{ steps.meta.outputs.repository }}:source-${{ github.sha }}
          build-args: |
            VERSION=${{ steps.meta.outputs.tag }}
            VCS_REF=${{ github.sha }}

      - name: Build and push plugin packages
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE_REPOSITORY: ghcr.io/${{ steps.meta.outputs.repository }}
          PLUGIN_BASE: ghcr.io/${{ steps.meta.outputs.plugin }}
        run: |
          set -euo pipefail
          test -n "$IMAGE_DIGEST"
          INDEX_IMAGE="${IMAGE_REPOSITORY}@${IMAGE_DIGEST}"
          INDEX_JSON="$(docker buildx imagetools inspect --raw "$INDEX_IMAGE")"
          for ARCH in amd64 arm64; do
            PLATFORM_DIGEST="$(
              jq -er --arg arch "$ARCH" '
                [.manifests[] | select(
                  .platform.os == "linux" and .platform.architecture == $arch
                )]
                | if length == 1 then .[0].digest
                  else error("expected exactly one linux/" + $arch + " manifest")
                  end
              ' <<< "$INDEX_JSON"
            )"
            IMAGE="${IMAGE_REPOSITORY}@${PLATFORM_DIGEST}"
            PLUGIN="${PLUGIN_BASE}-${ARCH}"
            echo "Packaging linux/${ARCH} from ${IMAGE}"
            rm -rf plugin/rootfs
            mkdir -p plugin/rootfs
            docker pull --platform "linux/${ARCH}" "$IMAGE"
            CID=$(docker create --platform "linux/${ARCH}" "$IMAGE")
            docker export "$CID" | tar -x -C plugin/rootfs
            docker rm -f "$CID"
            cp config.json plugin/
            docker plugin create "$PLUGIN" ./plugin
            docker plugin push "$PLUGIN"
            docker plugin rm -f "$PLUGIN" || true
          done

      - name: Create multi-arch plugin manifest
        run: |
          PLUGIN="ghcr.io/${{ steps.meta.outputs.plugin }}"
          docker manifest create \
            "$PLUGIN" \
            "${PLUGIN}-amd64" \
            "${PLUGIN}-arm64"
          docker manifest annotate "$PLUGIN" "${PLUGIN}-amd64" --os linux --arch amd64
          docker manifest annotate "$PLUGIN" "${PLUGIN}-arm64" --os linux --arch arm64
          docker manifest push --purge "$PLUGIN"
